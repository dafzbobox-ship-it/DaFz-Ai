<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DaFz-Ai Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span>DaFz-Ai</span>
        <span class="brand-subtitle">Assistant generatif</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="clearBtn" title="Reset chat">♻️</button>
        <button class="icon-btn" id="settingsBtn" title="Settings">⚙️</button>
      </div>
    </header>

    <section class="chat-card">
      <div class="status-panel">
        <div>
          <div class="status-pill" id="connectionIndicator">Offline</div>
          <p class="status-text">Dukungan semua API key: OpenAI, Anthropic, Hugging Face, Google / Gemini.</p>
        </div>
      </div>
      <div class="messages" id="messages"></div>
    </section>

    <form class="input-area" onsubmit="event.preventDefault(); sendMessage();">
      <textarea id="messageInput" placeholder="Tulis pesan..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" type="submit">➤</button>
    </form>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop"></div>
  <section class="settings-panel hidden" id="settingsPanel">
    <div class="panel-header">
      <div>
        <h2>Settings</h2>
        <p>Masukkan API key dan pilih provider.</p>
      </div>
      <button class="close-btn" id="closeSettingsBtn">✕</button>
    </div>

    <div class="form-group">
      <label for="providerSelect">Provider API</label>
      <select id="providerSelect">
        <option value="auto">Otomatis</option>
        <option value="openai">OpenAI</option>
        <option value="anthropic">Anthropic</option>
        <option value="huggingface">Hugging Face</option>
        <option value="google">Google / Gemini</option>
      </select>
    </div>

    <div class="form-group">
      <label for="apiKeyInput">API Key</label>
      <input id="apiKeyInput" type="password" placeholder="Masukkan API key Anda" />
      <div class="input-note">Contoh: sk-..., key_..., sk-ant-..., hf_..., AIza..., ya29..., AQ.... (Google)</div>
    </div>

    <div class="form-group">
      <label for="modelSelect">Model</label>
      <select id="modelSelect">
        <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
        <option value="gpt-4">gpt-4</option>
        <option value="claude-3.5-mini">claude-3.5-mini</option>
        <option value="claude-3.5-pro">claude-3.5-pro</option>
      </select>
    </div>

    <div class="form-group">
      <label for="botNameInput">Nama Bot</label>
      <input id="botNameInput" type="text" placeholder="NeonAI" />
    </div>

    <div class="form-group">
      <label for="botPersona">Persona Bot</label>
      <input id="botPersona" type="text" placeholder="Helpful, friendly, dan sedikit gaul" />
    </div>

    <button class="save-btn" id="saveSettingsBtn" type="button">💾 Simpan</button>
    <button class="secondary-btn" id="deleteKeyBtn" type="button">🗑️ Hapus API Key</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
